name: Build iOS unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/TradingControlApp
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios/TradingControlApp
        run: |
          set -euo pipefail
          DERIVED_DATA="$PWD/DerivedData"
          set +e
          xcodebuild \
            -project TradingControlApp.xcodeproj \
            -scheme TradingControlApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "### Xcode build failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|warning:|SwiftCompile|CompileSwift|CodeSign|Signing" xcodebuild.log | tail -80 >> "$GITHUB_STEP_SUMMARY" || tail -80 xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            SUMMARY=$(grep -E "error:" xcodebuild.log | tail -5 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' || true)
            if [ -n "$SUMMARY" ]; then
              echo "::error title=Xcode build errors::$SUMMARY"
            fi
            exit "$BUILD_STATUS"
          fi

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/TradingBot.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error title=Missing app bundle::Expected $APP_PATH after successful build"
            find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print || true
            exit 1
          fi
          rm -rf Payload TradingBot-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry TradingBot-unsigned.ipa Payload

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/TradingControlApp/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TradingBot-unsigned-ipa
          path: ios/TradingControlApp/TradingBot-unsigned.ipa
          if-no-files-found: error
