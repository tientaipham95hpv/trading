name: iOS Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd TradingControlApp
          xcodegen generate

      - name: Build Debug (iPhone 390pt)
        run: |
          set -o pipefail
          xcodebuild \
            -project TradingControlApp/TradingControlApp.xcodeproj \
            -scheme TradingControlApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            clean build

      - name: Test (iPhone 390pt)
        run: |
          set -o pipefail
          xcodebuild \
            -project TradingControlApp/TradingControlApp.xcodeproj \
            -scheme TradingControlApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            test

      - name: Build Release (generic simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project TradingControlApp/TradingControlApp.xcodeproj \
            -scheme TradingControlApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
